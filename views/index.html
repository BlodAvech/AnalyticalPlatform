<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytical Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Analytical Platform - Time Series Data Visualization</h1>

        <div class="form-section">
            <div class="form-group">
                <label for="field">Select Field:</label>
                <select id="field">
                    <option value="field1">Temperature</option>
                    <option value="field2">Humidity</option>
                    <option value="field3">Wind Speed</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="startDate">Start Date:</label>
                    <input type="date" id="startDate" value="2006-01-01">
                </div>
                <div class="form-group">
                    <label for="endDate">End Date:</label>
                    <input type="date" id="endDate" value="2006-01-31">
                </div>
            </div>

            <div class="form-group">
                <label for="chartType">Chart Type:</label>
                <select id="chartType">
                    <option value="line">Line Chart</option>
                    <option value="bar">Bar Chart</option>
                </select>
            </div>

            <button onclick="fetchData()">Visualize Data</button>
            <button onclick="fetchMetrics()">Show Statistics</button>
        </div>

        <div id="error" class="error"></div>
        <div id="loading" class="loading">Loading...</div>

        <div id="statsContainer" class="stats-container" style="display: none;">
            <div class="stat-card">
                <div class="stat-label">Count</div>
                <div class="stat-value" id="count">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Average</div>
                <div class="stat-value" id="average">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Minimum</div>
                <div class="stat-value" id="minimum">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Maximum</div>
                <div class="stat-value" id="maximum">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Standard Deviation</div>
                <div class="stat-value" id="stdDev">-</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="dataChart"></canvas>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
